<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeVerse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div class="logo-wrap">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="TradeVerse Logo">
            </div>
        </div>
    </div>

    <div class="page-wrap">
        <div class="auth-card">
            <h1>Login</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <span class="toggle-pw" onclick="togglePassword('password', this)">SHOW</span>
                    </div>
                </div>

                <div class="forgot-row">
                    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Log In</button>
            </form>

            <div class="card-footer">
                Don't have an account? <a href="{{ url_for('register') }}">Create one here</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
