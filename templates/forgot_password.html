<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TradeVerse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div class="logo-wrap">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="TradeVerse Logo">
            </div>
        </div>
    </div>

    <div class="page-wrap">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your registered email</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="btn">Send Reset Link</button>
            </form>

            <div class="card-footer">
                Remembered your password? <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
